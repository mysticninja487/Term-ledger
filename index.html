  panel.classList.toggle('open', ui.settingsOpen);
  if(!ui.settingsOpen) return;
  const sizeKb = Math.max(1, Math.round(JSON.stringify(db).length / 1024));
  const persistTxt = persistState === 'granted'
    ? '<b>yes ✓</b>'
    : persistState === 'denied'
      ? '<b>not guaranteed</b> — the browser may clear it if the device runs very low on space. Exporting backups covers that.'
      : 'checking…';
  panel.innerHTML = `
    <div class="settings-block">
      <h3>Term settings — ${escapeHtml(term.name)}</h3>
      <div class="settings-row">
        <div><label>Term start</label><input type="date" data-k="start" value="${term.start}"></div>
        <div><label>Total class days</label><input type="number" data-k="days" min="1" value="${term.totalClassDays}"></div>
        <div><label>Unlogged routine classes count as</label>
          <select data-k="auto">${AUTO_MODES.map(m => `<option value="${m}" ${m === term.autoMode ? 'selected' : ''}>${escapeHtml(autoModeLabel(m))}</option>`).join('')}</select></div>
      </div>
      <div class="term-summary">Runs <b>${fmtShort(term.start)}</b> → <b>${fmtShort(info.endIso)}</b> (${term.totalClassDays} class days, Sun–Thu, holidays excluded)</div>
      <div class="note">Auto-fill only touches days that have <b>already passed</b>. Anything you log yourself (including “Cancelled”) always wins over auto-fill. You can override the setting per subject/teacher on their page.</div>
      <div style="margin-top:14px;">
        <label>Holidays</label>
        <div id="holidayList">${term.holidays.map(h => `
          <div class="holiday-row">
            <input type="date" data-k="hol-start" data-hid="${h.id}" value="${h.start}">
            <span>to</span>
            <input type="date" data-k="hol-end" data-hid="${h.id}" value="${h.end}">
            <button class="icon-btn" data-act="hol-del" data-hid="${h.id}" title="Remove">✕</button>
          </div>`).join('')}</div>
        <button class="add-holiday" data-act="hol-add">+ add holiday range</button>
      </div>
      <div class="btn-row" style="margin-top:14px"><button class="ghost small danger" data-act="term-delete">Delete this term…</button></div>
    </div>

    <div class="settings-block">
      <h3>Backup &amp; import</h3>
      <div class="btn-row">
        <button class="ghost" data-act="export-all">⬇ Export all terms</button>
        <button class="ghost" data-act="export-term">⬇ Export this term</button>
        <button class="ghost" data-act="import">⬆ Import backup / autosave file</button>
      </div>
      <div class="note">${db.lastExport ? `Last export: <b>${fmtStamp(db.lastExport)}</b>.` : '<b>You have not exported a backup yet.</b>'}
        Import reads files from every version of this app, including old autosave files. You choose whether to add them as new terms or replace everything.</div>
      <label class="check-row"><input type="checkbox" data-k="leave" ${db.settings.autoDownloadOnLeave ? 'checked' : ''}>
        <span>Download a backup file automatically whenever I leave or minimise the app (only if something changed). Off by default — handy on phones where file autosave isn't possible.</span></label>
    </div>

    <div class="settings-block">
      <h3>In-app storage</h3>
      <div class="note">
        App database (IndexedDB): ${idbOk ? '<b>working ✓</b>' : '<b>unavailable</b> in this browser'}<br>
        Second copy in browser storage: ${lsOk ? '<b>working ✓</b>' : '<b>failed</b>'}<br>
        Protected from automatic cleanup: ${persistTxt}<br>
        Data size: <b>~${sizeKb} KB</b> · ${db.terms.length} term${db.terms.length === 1 ? '' : 's'}
      </div>
      <div class="mini-label">Restore points</div>
      <div class="note" style="margin-top:0">Snapshots are taken once a day and before imports, restores and deletions.</div>
      <div class="snap-list" id="snapList"><div class="note">Loading…</div></div>
    </div>

    <div class="settings-block">
      <h3>Live autosave file</h3>
      ${autosaveBlockHtml()}
    </div>`;
  fillSnapshots();
}

async function fillSnapshots(){
  const el = $('snapList'); if(!el) return;
  const snaps = await listSnapshots();
  const el2 = $('snapList'); if(!el2) return;
  el2.innerHTML = snaps.length
    ? snaps.map(s => `<div class="snap-row"><span><b>${escapeHtml(s.label)}</b> · ${fmtStamp(s.at)}</span>
        <button class="ghost small" data-act="snap-restore" data-id="${s.id}">Restore</button></div>`).join('')
    : `<div class="note">${idbOk ? 'No restore points yet.' : 'Restore points need the in-app database, which this browser does not offer.'}</div>`;
}

function onSettingsClick(e){
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, term = curTerm();
  if(act === 'hol-add'){
    const t = todayISO(); term.holidays.push({id:uid(), start:t, end:t}); commit(); render();
  } else if(act === 'hol-del'){
    term.holidays = term.holidays.filter(h => h.id !== b.dataset.hid); commit(); render();
  } else if(act === 'export-all'){ exportAll(); showToast('Backup downloaded ✓'); renderSettings(term, computeTermInfo(term)); }
  else if(act === 'export-term'){ exportTerm(term); showToast('Term exported ✓'); renderSettings(term, computeTermInfo(term)); }
  else if(act === 'import'){ $('importFile').click(); }
  else if(act === 'term-delete'){ deleteTerm(); }
  else if(act === 'snap-restore'){ restoreSnapshot(Number(b.dataset.id)); }
  else if(act === 'fs-connect'){ connectAutosave(); }
  else if(act === 'fs-disconnect'){ detachAutosaveHandle().then(() => { showToast('Autosave file disconnected'); render(); }); }
  else if(act === 'fs-resume'){
    fsHandle.requestPermission({mode:'readwrite'}).then(async p => {
      if(p === 'granted'){ fsState = 'active'; await writeAutosaveFile(); }
      render();
    }).catch(() => render());
  }
}
function onSettingsChange(e){
  const el = e.target, k = el.dataset.k; if(!k) return;
  const term = curTerm();
  if(k === 'start'){
    if(isISO(el.value)){ term.start = el.value; tstate(term).month = null; commit(); }
  } else if(k === 'days'){
    const v = parseInt(el.value, 10); if(v > 0){ term.totalClassDays = v; commit(); }
  } else if(k === 'auto'){
    term.autoMode = el.value; commit();
  } else if(k === 'hol-start' || k === 'hol-end'){
    const h = term.holidays.find(x => x.id === el.dataset.hid);
    if(h && isISO(el.value)){
      if(k === 'hol-start'){ h.start = el.value; if(h.end < h.start) h.end = h.start; }
      else { h.end = el.value; if(h.end < h.start) h.end = h.start; }
      commit();
    }
  } else if(k === 'leave'){
    db.settings.autoDownloadOnLeave = el.checked; commit();
  }
  render();
}

/* ---------------- subject tabs ---------------- */
function renderTabs(term, info){
  const {ent: active} = resolveActive(term, info);
  let html = '';
  [['course','Courses'], ['lab','Labs']].forEach(([type, label]) => {
    const items = term.entities.filter(e => e.type === type);
    if(!items.length) return;
    html += `<div class="tab-group-label">${label}</div>`;
    items.forEach(e => {
      const s = entityStats(term, info, e);
      const pctColor = s.pct === null ? 'var(--ink-soft)' : (s.pct < 75 ? 'var(--crimson)' : 'var(--green)');
      html += `<div class="tab ${active && e.id === active.id ? 'active' : ''}" data-act="tab" data-id="${e.id}">
          <span class="tab-main">
            <span class="dot" style="${dotStyle(e)}"></span>
            <span><div class="tab-code">${escapeHtml(e.code)}</div><div class="tab-name">${escapeHtml(e.name)}</div></span>
          </span>
          <span style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <span class="tab-pct" style="color:${pctColor}">${s.pct === null ? '—' : s.pct + '%'}</span>
          </span>
        </div>`;
    });
  });
  $('tabs').innerHTML = html + `<button class="add-tab" data-act="add-subject">+ Add subject</button>`;
}
function onTabsClick(e){
  const b = e.target.closest('[data-act]'); if(!b) return;
  const term = curTerm();
  if(b.dataset.act === 'add-subject'){ addSubject(); return; }
  const ent = term.entities.find(x => x.id === b.dataset.id); if(!ent) return;
  if(b.dataset.act === 'tab-del'){ e.stopPropagation(); deleteSubject(ent); return; }
  const st = tstate(term);
  st.entityId = ent.id; st.sectionId = ent.sections[0].id;
  render();
}

/* ---------------- main page ---------------- */
function renderPage(term, info){
  const page = $('page');
  const {st, ent, sec} = resolveActive(term, info);
  if(!ent){
    page.innerHTML = `<div class="empty-state"><div class="stamp-icon">📋</div>
      <p>No subjects in this term yet.</p><button class="primary" data-act="add-subject">+ Add a subject</button></div>`;
    return;
  }
  let html = `<div class="page-head">
      <div>
        <div class="subject-title"><span class="dot" style="${dotStyle(ent)}"></span>${escapeHtml(ent.code)}
          <button class="icon-btn" data-act="edit-subject" title="Edit subject" style="font-size:13px">✎</button></div>
        <div class="subject-sub">${escapeHtml(ent.name)} · ${ent.type === 'course' ? 'Course' : 'Lab'}</div>
      </div>
      <div class="month-nav">
        <button data-act="prev-month" aria-label="Previous month">‹</button>
        <span>${parseISO(st.month).toLocaleString('default', {month:'long', year:'numeric'})}</span>
        <button data-act="next-month" aria-label="Next month">›</button>
      </div>
    </div>`;
  if(ent.type === 'course'){
    html += `<div class="section-pills">` + ent.sections.map(s => `
      <div class="pill ${s.id === sec.id ? 'active' : ''}" data-act="pill" data-id="${s.id}">
        <span>${escapeHtml(s.teacherName)}</span><span class="edit-ic" data-act="pill-edit" data-id="${s.id}" title="Rename teacher">✎</span>
      </div>`).join('') + `</div>`;
  }
  html += renderRoutineBox(term, ent, sec);
  html += renderCalendarBlock(term, info, ent, sec, st);
  html += renderMarksBlock(term, info, ent, sec);
  page.innerHTML = html;
}

function renderRoutineBox(term, ent, sec){
  const sum = routineSummary(sec);
  const termMode = autoModeLabel(term.autoMode);
  return `<div class="routine-box">
      <div class="rb-left">
        <span><b>Routine:</b> ${sum ? escapeHtml(sum) : 'not set yet'}</span>
        <span>${sum ? 'Classes in the routine are filled in automatically for days that have passed.' : 'Add a routine to have attendance filled in automatically.'}</span>
      </div>
      <div class="rb-right">
        <label style="font-size:11px">If I don't log a class:</label>
        <select class="auto-select" data-act="sec-auto">
          <option value="" ${!sec.autoMode ? 'selected' : ''}>Term setting (${escapeHtml(termMode)})</option>
          ${AUTO_MODES.map(m => `<option value="${m}" ${sec.autoMode === m ? 'selected' : ''}>${escapeHtml(autoModeLabel(m))}</option>`).join('')}
        </select>
        <button class="ghost small" data-act="edit-routine">🗓 Edit routine</button>
      </div>
    </div>`;
}

function renderCalendarBlock(term, info, ent, sec, st){
  const [y, m] = st.month.split('-').map(Number);
  const firstDow = new Date(y, m-1, 1).getDay();
  const totalDays = new Date(y, m, 0).getDate();
  let cells = '';
  ['S','M','T','W','T','F','S'].forEach(d => cells += `<div class="cal-dow">${d}</div>`);
  for(let i = 0; i < firstDow; i++) cells += `<div class="cal-cell blank"></div>`;
  for(let day = 1; day <= totalDays; day++){
    const iso = isoDate(y, m-1, day);
    const di = dayInfo(term, info, sec, iso);
    let inner = '';
    if(di.list.length === 1){
      const it = di.list[0];
      inner = `<span class="stamp ${it.s} ${it.auto ? 'auto' : ''}">${it.s === 'present' ? 'P' : it.s === 'absent' ? 'A' : 'C'}</span>`;
    } else if(di.list.length > 1){
      inner = `<div class="multi-stamp">${di.list.map(it => `<span class="mini-dot ${it.s} ${it.auto ? 'auto' : ''}"></span>`).join('')}</div>`;
    }
    if(!di.list.length && di.N > 0){
      inner += `<div class="sched-dots">${di.slots.map(() => '<span class="sched-dot"></span>').join('')}</div>`;
    }
    const cls = ['cal-cell'];
    if(di.blocked) cls.push('blocked-off');
    else if(iso < term.start || iso > info.endIso) cls.push('outside-term');
    if(iso === info.today) cls.push('today');
    cells += `<div class="${cls.join(' ')}" ${di.blocked ? '' : `data-act="cell" data-date="${iso}"`}><span class="num">${day}</span>${inner}</div>`;
  }
  const s = sectionStats(term, info, sec);
  const low = s.pct !== null && s.pct < 75;
  const hasRoutine = sec.routine.length > 0;
  return `
    <div class="section-label">Attendance</div>
    <div class="attendance-bar-wrap">
      <span>${s.total ? `${s.present} / ${s.total} held classes` : 'No classes counted yet'}${s.auto ? ` · ${s.auto} auto-filled` : ''}${s.cancelled ? ` · ${s.cancelled} cancelled` : ''}</span>
      <div class="attendance-bar ${low ? 'low' : ''}"><div style="width:${s.pct === null ? 0 : s.pct}%"></div></div>
      <span>${s.pct !== null ? s.pct + '%' : '—'}</span>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><span class="leg-dot" style="background:var(--green)"></span>Present</span>
      <span><span class="leg-dot" style="background:var(--crimson)"></span>Absent</span>
      <span><span class="leg-dot" style="background:var(--gray)"></span>Cancelled</span>
      <span><span class="leg-dot" style="background:var(--crimson);opacity:0.55"></span>Weekend / Holiday</span>
      ${hasRoutine ? `<span><span class="leg-dot" style="border:1.5px dashed var(--green)"></span>Dashed = auto-filled from routine</span>` : ''}
    </div>`;
}

function renderMarksBlock(term, info, ent, sec){
  const isCourse = ent.type === 'course';
  const cap = isCourse ? 30 : null;
  const ms = sectionMarks(sec);
  const today = info.today;
  let capBlock = '';
  if(cap){
    const over = ms.sumMaxAll > cap;
    capBlock = `<div class="marks-cap-wrap">
        CT weight planned: <b>${ms.sumMaxAll} / ${cap}</b> marks${over ? ' <span style="color:var(--crimson)">(over the cap!)</span>' : ''}
        ${ms.sumMaxPub ? ` · scored <b>${ms.scored} / ${ms.sumMaxPub}</b> so far (${ms.avgPct}%)` : ''}${ms.pending ? ` · <b>${ms.pending}</b> awaiting marks` : ''}
        <div class="marks-cap-bar ${over ? 'over' : ''}"><div style="width:${Math.min(100, Math.round(ms.sumMaxAll / cap * 100))}%"></div></div>
      </div>`;
  } else if(sec.tests.length){
    capBlock = `<div class="marks-cap-wrap">${ms.sumMaxPub ? `Scored <b>${ms.scored} / ${ms.sumMaxPub}</b> (${ms.avgPct}%)` : 'No marks published yet'}${ms.pending ? ` · <b>${ms.pending}</b> awaiting marks` : ''}</div>`;
  }
  let table;
  if(!sec.tests.length){
    table = `<p style="color:var(--ink-soft);font-size:13px;margin:0 0 6px;">No CTs logged yet. Log a CT as soon as it's announced or held — marks can come later.</p>`;
  } else {
    const sorted = sec.tests.slice().sort((a,b) => (a.date || '9999').localeCompare(b.date || '9999') || a.name.localeCompare(b.name));
    table = `<div class="table-scroll"><table class="test-table"><thead><tr><th>CT</th><th>Date</th><th>Marks</th><th>Result</th><th></th></tr></thead><tbody>` +
      sorted.map(t => {
        const editing = ui.ctEdit === t.id;
        let marksCell, result;
        if(t.marks === null || editing){
          marksCell = `<input class="marks-input" type="number" step="any" min="0" data-id="${t.id}" value="${t.marks === null ? '' : t.marks}" placeholder="marks"> / ${t.max}
            <button class="mini-save" data-act="ct-save" data-id="${t.id}">Save</button>
            ${editing ? `<button class="link-btn" data-act="ct-cancel">cancel</button>${t.marks !== null ? `<button class="link-btn" data-act="ct-clear" data-id="${t.id}">clear marks</button>` : ''}` : ''}`;
        } else {
          marksCell = `${t.marks} / ${t.max} <button class="icon-btn" data-act="ct-edit" data-id="${t.id}" title="Edit marks">✎</button>`;
        }
        if(t.marks !== null){
          const pct = Math.round(t.marks / t.max * 100);
          result = `<span class="grade-pill" style="background:${gradeColor(pct)}22;color:${gradeColor(pct)}">${pct}%</span>`;
        } else if(t.date && t.date > today){
          result = `<span class="state-pill upcoming">Upcoming</span>`;
        } else {
          result = `<span class="state-pill pending">Marks pending</span>`;
        }
        return `<tr>
          <td>${escapeHtml(t.name)} <button class="icon-btn" data-act="ct-meta" data-id="${t.id}" title="Edit name, date or total" style="font-size:12px">✎</button></td>
          <td>${t.date ? fmtShort(t.date) : '—'}</td>
          <td class="marks-cell">${marksCell}</td>
          <td>${result}</td>
          <td><button class="del-row" data-act="ct-del" data-id="${t.id}" title="Delete CT">✕</button></td>
        </tr>`;
      }).join('') + `</tbody></table></div>`;
  }
  const remaining = cap ? cap - ms.sumMaxAll : null;
  const defMax = isCourse ? (ms.sumMaxAll === 0 ? 20 : (remaining > 0 ? Math.min(remaining, 20) : 10)) : '';
  return `
    <div class="section-label">${isCourse ? 'Class Tests' : 'Lab Assessments'}</div>
    ${capBlock}
    ${table}
    <form class="add-form" id="addTestForm">
      <div class="field"><label>Name</label><input class="wide" name="name" value="CT ${sec.tests.length + 1}" required></div>
      <div class="field"><label>Date</label><input name="date" type="date" value="${today}"></div>
      <div class="field"><label>Out of</label><input name="max" type="number" step="any" min="0.1" value="${defMax}" required style="width:70px"></div>
      <div class="field"><label>Marks (optional)</label><input name="marks" type="number" step="any" min="0" placeholder="not out yet" style="width:110px"></div>
      <button type="submit" class="primary">Log CT</button>
    </form>
    <p class="hint-inline">Log the CT when it's announced or held — leave marks empty and fill them in here once they're published.</p>`;
}

/* ---------------- page events (delegated) ---------------- */
function activeCtx(){
  const term = curTerm(), info = computeTermInfo(term);
  const {st, ent, sec} = resolveActive(term, info);
  return {term, info, st, ent, sec};
}
function shiftMonth(st, delta){
  const d = parseISO(st.month); d.setMonth(d.getMonth() + delta); d.setDate(1); st.month = dateToISO(d);
}
async function onPageClick(e){
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act === 'sec-auto') return;
  const {term, info, st, ent, sec} = activeCtx();
  if(act === 'add-subject'){ addSubject(); return; }
  if(!ent) return;
  if(act === 'prev-month'){ shiftMonth(st, -1); render(); }
  else if(act === 'next-month'){ shiftMonth(st, 1); render(); }
  else if(act === 'pill'){ st.sectionId = b.dataset.id; render(); }
  else if(act === 'pill-edit'){
    e.stopPropagation();
    const s = ent.sections.find(x => x.id === b.dataset.id);
    const r = await askForm({title:'Teacher name', fields:[{id:'name', label:'Name', type:'text', value:s.teacherName, required:true}]});
    if(r){ s.teacherName = r.name; commit(); render(); }
  }
  else if(act === 'cell'){ openModal(dayModalSpec(term.id, ent.id, sec.id, b.dataset.date)); }
  else if(act === 'edit-routine'){ openModal(routineModalSpec()); }
  else if(act === 'edit-subject'){ editSubject(ent); }
  else if(act === 'ct-edit'){ ui.ctEdit = b.dataset.id; render(); }
  else if(act === 'ct-cancel'){ ui.ctEdit = null; render(); }
  else if(act === 'ct-clear'){
    const t = sec.tests.find(x => x.id === b.dataset.id); t.marks = null; ui.ctEdit = null; commit(); render(); showToast('Marks cleared — back to pending');
  }
  else if(act === 'ct-save'){
    const t = sec.tests.find(x => x.id === b.dataset.id);
    const inp = $('page').querySelector(`.marks-input[data-id="${t.id}"]`);
    saveCtMarks(t, inp);
  }
  else if(act === 'ct-meta'){
    const t = sec.tests.find(x => x.id === b.dataset.id);
    const r = await askForm({title:'Edit CT', fields:[
      {id:'name', label:'Name', type:'text', value:t.name, required:true},
      {id:'date', label:'Date', type:'date', value:t.date},
      {id:'max', label:'Out of', type:'number', value:t.max, step:'any', min:0.1, required:true,
        validate:v => (Number(v.max) > 0 ? (t.marks !== null && t.marks > Number(v.max) ? 'The published marks are higher than that total' : null) : 'Enter a total above 0')}
    ]});
    if(r){ t.name = r.name; t.date = isISO(r.date) ? r.date : ''; t.max = Number(r.max); commit(); render(); }
  }
  else if(act === 'ct-del'){
    const t = sec.tests.find(x => x.id === b.dataset.id);
    const ok = await askConfirm({title:'Delete this CT?', message:`“${t.name}” ${t.marks !== null ? 'and its marks' : ''} will be removed.`, confirmLabel:'Delete', danger:true});
    if(ok){ sec.tests = sec.tests.filter(x => x.id !== t.id); commit(); render(); }
  }
}
function saveCtMarks(t, inp){
  const v = inp.value.trim();
  if(v === ''){ showToast('Type the marks first, or leave the CT as pending'); return; }
  const n = Number(v);
  if(!Number.isFinite(n) || n < 0){ showToast('Enter a valid mark'); return; }
  if(n > t.max){ showToast(`Marks can't be above ${t.max}. Edit the CT's total first if that's wrong.`); return; }
  t.marks = n; ui.ctEdit = null; commit(); render(); showToast('Marks saved ✓');
}
function onPageChange(e){
  const el = e.target;
  if(el.dataset && el.dataset.act === 'sec-auto'){
    const {sec} = activeCtx();
    sec.autoMode = el.value || null; commit(); render();
  }
}
function onPageSubmit(e){
  if(e.target.id !== 'addTestForm') return;
  e.preventDefault();
  const {sec} = activeCtx();
  const f = e.target;
  const name = f.elements.name.value.trim() || `CT ${sec.tests.length + 1}`;
  const max = Number(f.elements.max.value);
  if(!(max > 0)){ showToast('Enter what the CT is out of'); return; }
  const rawMarks = f.elements.marks.value.trim();
  let marks = null;
  if(rawMarks !== ''){
    marks = Number(rawMarks);
    if(!Number.isFinite(marks) || marks < 0){ showToast('Enter a valid mark'); return; }
    if(marks > max){ showToast(`Marks can't be above ${max}`); return; }
  }
  const date = isISO(f.elements.date.value) ? f.elements.date.value : '';
  sec.tests.push({id:uid(), name, max, date, marks});
  commit(); render();
  showToast(marks === null ? 'CT logged — marks pending' : 'CT logged ✓');
}
function onPageKeydown(e){
  if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('marks-input')){
    e.preventDefault();
    const {sec} = activeCtx();
    const t = sec.tests.find(x => x.id === e.target.dataset.id);
    if(t) saveCtMarks(t, e.target);
  }
}

/* ---------------- day modal (attendance for one date) ---------------- */
function dayModalSpec(termId, entId, secId, date){
  const lookup = () => {
    const term = db.terms.find(t => t.id === termId);
    const ent = term && term.entities.find(e => e.id === entId);
    const sec = ent && ent.sections.find(s => s.id === secId);
    return term && ent && sec ? {term, ent, sec} : null;
  };
  const chip = (status, auto) => status
    ? `<span class="status-chip ${status} ${auto ? 'auto' : ''}">${status[0].toUpperCase() + status.slice(1)}${auto ? ' · auto' : ''}</span>`
    : `<span class="status-chip none">Not counted yet</span>`;
  const seg = (attr, current) => `<div class="seg">${STATUSES.map(s =>
    `<button type="button" class="${s} ${current === s ? 'on' : ''}" ${attr} data-s="${s}"><span>${s[0].toUpperCase() + s.slice(1)}</span></button>`).join('')}</div>`;
  return {
    live:true, cls:'mid',
    render:() => {
      const c = lookup(); if(!c){ return `<h4>Not found</h4><div class="modal-sub">This subject no longer exists.</div>`; }
      const info = computeTermInfo(c.term);
      const di = dayInfo(c.term, info, c.sec, date);
      const label = c.ent.type === 'course' ? `${c.ent.code} · ${c.sec.teacherName}` : `${c.ent.code} (Lab)`;
      let body = '';
      if(di.N){
        body += `<div class="mini-label">From the routine</div>`;
        body += di.slots.map((r, i) => `<div class="slot-row">
            <div class="slot-top"><span class="slot-name">Class ${i + 1}${r.time ? ' · ' + escapeHtml(r.time) : ''}</span>
              <span class="slot-status">${chip(r.status, r.auto)}</span></div>
            ${seg(`data-act="slot" data-rid="${r.id}"`, r.explicit ? r.status : null)}
            ${r.explicit ? `<div style="margin-top:6px;text-align:right"><button type="button" class="link-btn" data-act="slot-clear" data-rid="${r.id}">${di.autoOk ? 'reset to auto' : 'clear'}</button></div>` : ''}
          </div>`).join('');
        body += di.autoOk
          ? `<div class="modal-sub" style="margin-top:-2px">Unlogged classes count as <b>${autoModeLabel(di.mode)}</b>. Tap a status to override.</div>`
          : `<div class="modal-sub" style="margin-top:-2px">${di.mode === 'off' ? 'Auto-fill is off for this subject.' : 'Auto-fill applies once the day has passed — log it yourself if you want it counted now.'}</div>`;
      }
      if(di.others.length){
        body += `<div class="mini-label">${di.N ? 'Extra / other entries' : 'Logged'}</div><div class="modal-entries">` +
          di.others.map(o => `<div class="modal-entry"><span class="modal-entry-status">${chip(o.s, false)}${o.extra ? '<span style="font-size:11px;color:var(--ink-soft)">extra class</span>' : ''}</span>
            <button type="button" class="icon-btn" data-act="other-del" data-idx="${o.idx}" title="Remove">✕</button></div>`).join('') + `</div>`;
      }
      body += `<div class="mini-label">${di.N ? 'Add an extra class' : (c.sec.routine.length ? 'Add an extra class (none scheduled today)' : 'Log a class')}</div>${seg('data-act="extra"', null)}`;
      return `<h4>${escapeHtml(fmtLong(date))}</h4><div class="modal-sub">${escapeHtml(label)}</div>${body}
        <div class="modal-actions" style="margin-top:14px"><button class="ghost" data-act="close">Done</button></div>`;
    },
    wire:root => {
      root.querySelector('.modal-card').addEventListener('click', ev => {
        const b = ev.target.closest('[data-act]'); if(!b) return;
        const c = lookup(); if(!c) return;
        const act = b.dataset.act;
        if(act === 'close'){ closeModal(); return; }
        const info = computeTermInfo(c.term);
        const di = dayInfo(c.term, info, c.sec, date);
        const arr = c.sec.attendance[date] || (c.sec.attendance[date] = []);
        if(act === 'slot'){
          const r = di.slots.find(x => x.id === b.dataset.rid);
          const entry = {s:b.dataset.s, rid:r.id};
          if(r.entryIdx !== null) arr[r.entryIdx] = entry; else arr.push(entry);
        } else if(act === 'slot-clear'){
          const r = di.slots.find(x => x.id === b.dataset.rid);
          if(r && r.entryIdx !== null) arr.splice(r.entryIdx, 1);
        } else if(act === 'extra'){
          arr.push({s:b.dataset.s, x:true});
        } else if(act === 'other-del'){
          arr.splice(Number(b.dataset.idx), 1);
        }
        if(!arr.length) delete c.sec.attendance[date];
        commit(); render();
      });
    }
  };
}

/* ---------------- routine editor ---------------- */
function routineModalSpec(){
  return {
    live:true, cls:'wide',
    render:() => {
      const term = curTerm();
      const secs = listSections(term);
      if(!secs.length) return `<h4>Weekly routine</h4><div class="modal-sub">Add some subjects first.</div><div class="modal-actions"><button class="ghost" data-act="close">Close</button></div>`;
      const total = secs.reduce((a, x) => a + x.sec.routine.length, 0);
      const days = WORK_DAYS.map(dow => {
        const slots = [];
        secs.forEach(({ent, sec}) => sec.routine.filter(r => r.dow === dow).forEach(r => slots.push({ent, sec, r})));
        slots.sort((a, b) => byTime(a.r, b.r));
        const selId = ui.routineSel[dow] || secs[0].sec.id;
        return `<div class="rt-day"><h5>${DOW_LONG[dow]}</h5>
          <div class="rt-chips">${slots.length ? slots.map(({ent, sec, r}) => `
            <span class="rt-chip"><span class="dot" style="${dotStyle(ent)}"></span>${r.time ? `<span class="t">${escapeHtml(r.time)}</span>` : ''}${escapeHtml(sectionLabel(ent, sec))}
              <button class="icon-btn" data-act="rt-del" data-sid="${sec.id}" data-rid="${r.id}" title="Remove">✕</button></span>`).join('') : `<span class="rt-empty">No classes yet</span>`}</div>
          <div class="rt-add">
            <select data-dow="${dow}" data-role="rt-sel">${secs.map(({ent, sec}) =>
              `<option value="${sec.id}" ${sec.id === selId ? 'selected' : ''}>${escapeHtml(sectionLabel(ent, sec))}</option>`).join('')}</select>
            <input type="text" data-dow="${dow}" data-role="rt-time" placeholder="time (optional)" value="${escapeHtml(ui.routineTime[dow] || '')}">
            <button class="ghost small" data-act="rt-add" data-dow="${dow}">+ Add</button>
          </div>
        </div>`;
      }).join('');
      return `<h4>Weekly routine</h4>
        <div class="modal-sub">Add each class to the day it normally happens (Sunday–Thursday). ${total} weekly slot${total === 1 ? '' : 's'} so far. Past days are then filled in automatically; you only log the exceptions — cancellations, absences and extra classes. Changing the routine later re-computes auto-filled days, never the ones you logged.</div>
        ${days}
        <div class="modal-actions"><button class="primary" data-act="close">Done</button></div>`;
    },
    wire:root => {
      const card = root.querySelector('.modal-card');
      card.addEventListener('change', e => {
        if(e.target.dataset.role === 'rt-sel') ui.routineSel[e.target.dataset.dow] = e.target.value;
      });
      card.addEventListener('input', e => {
        if(e.target.dataset.role === 'rt-time') ui.routineTime[e.target.dataset.dow] = e.target.value;
      });
      card.addEventListener('click', e => {
        const b = e.target.closest('[data-act]'); if(!b) return;
        const term = curTerm();
        if(b.dataset.act === 'close'){ closeModal(); return; }
        if(b.dataset.act === 'rt-add'){
          const dow = Number(b.dataset.dow);
          const selEl = card.querySelector(`select[data-dow="${dow}"]`);
          const timeEl = card.querySelector(`input[data-dow="${dow}"]`);
          const target = listSections(term).find(x => x.sec.id === selEl.value);
          if(!target) return;
          target.sec.routine.push({id:uid(), dow, time:timeEl.value.trim().slice(0, 20)});
          ui.routineSel[dow] = selEl.value; ui.routineTime[dow] = '';
          commit(); render();
        } else if(b.dataset.act === 'rt-del'){
          const target = listSections(term).find(x => x.sec.id === b.dataset.sid);
          if(target){ target.sec.routine = target.sec.routine.filter(r => r.id !== b.dataset.rid); commit(); render(); }
        }
      });
    }
  };
}

/* ---------------- subjects ---------------- */
async function addSubject(){
  const term = curTerm();
  const used = new Set(term.entities.map(e => e.color));
  const freeColor = PALETTE.find(c => !used.has(c)) || PALETTE[term.entities.length % PALETTE.length];
  const r = await askForm({
    title:'Add subject',
    sub:'A course gets two teacher tabs (each with their own attendance and CTs). A lab gets one.',
    fields:[
      {id:'code', label:'Course code', type:'text', value:'', placeholder:'e.g. BME 4101', required:true},
      {id:'name', label:'Course name', type:'text', value:'', placeholder:'e.g. Biomedical Signal Processing', required:true},
      {id:'type', label:'Type', type:'select', value:'course', options:[{value:'course', label:'Course (2 teachers)'}, {value:'lab', label:'Lab (1 section)'}]},
      {id:'color', label:'Colour', type:'swatches', value:freeColor},
    ],
    submitLabel:'Add subject'
  });
  if(!r) return;
  const ent = makeEntity({code:r.code, name:r.name, type:r.type, color:r.color});
  term.entities.push(ent);
  const st = tstate(term); st.entityId = ent.id; st.sectionId = ent.sections[0].id;
  commit(); render(); showToast('Subject added ✓');
}
async function editSubject(ent){
  const r = await askForm({
    title:'Edit subject',
    fields:[
      {id:'code', label:'Course code', type:'text', value:ent.code, required:true},
      {id:'name', label:'Course name', type:'text', value:ent.name, required:true},
      {id:'color', label:'Colour', type:'swatches', value:PALETTE.includes(ent.color) ? ent.color : PALETTE[0]},
    ],
    extraButtons:[{label:'Delete subject', act:'delete', cls:'danger'}]
  });
  if(!r) return;
  if(r.__action === 'delete'){ deleteSubject(ent); return; }
  ent.code = r.code; ent.name = r.name; ent.color = r.color;
  commit(); render();
}
async function deleteSubject(ent){
  const ok = await askConfirm({
    title:'Delete subject?',
    message:`This removes “${ent.code} — ${ent.name}” with all its attendance, routine and CT marks. A restore point is saved first.`,
    confirmLabel:'Delete', danger:true
  });
  if(!ok) return;
  await addSnapshot(`Before deleting ${ent.code}`);
  const term = curTerm();
  term.entities = term.entities.filter(x => x.id !== ent.id);
  commit(); render(); showToast('Subject deleted');
}

/* ---------------- terms ---------------- */
async function newTerm(){
  const cur = curTerm();
  const r = await askForm({
    title:'New term',
    sub:'Each term keeps its own subjects, routine, holidays, attendance and CTs.',
    fields:[
      {id:'name', label:'Term name', type:'text', value:'', placeholder:'e.g. 3rd Year 2nd Term', required:true},
      {id:'start', label:'First day of term', type:'date', value:nextSundayISO(), required:true,
        validate:v => isISO(v.start) ? null : 'Pick a start date'},
      {id:'days', label:'Total class days', type:'number', value:'65', min:1, required:true,
        hint:'Counted Sunday–Thursday, excluding holidays you add later.',
        validate:v => parseInt(v.days, 10) > 0 ? null : 'Enter the number of class days'},
      {id:'copy', label:'Subjects', type:'select', value:'none', options:[
        {value:'none', label:'Start empty — I\'ll add them'},
        {value:'subjects', label:`Copy subjects & teachers from “${cur.name}”`},
        {value:'routine', label:'Copy subjects, teachers & routine'}]},
    ],
    submitLabel:'Create term'
  });
  if(!r) return;
  const t = makeTerm({name:r.name, start:r.start, totalClassDays:parseInt(r.days, 10), holidays:[], entities:[], autoMode:cur.autoMode});
  if(r.copy !== 'none'){
    t.entities = cur.entities.map(e => ({
      id:uid(), code:e.code, name:e.name, type:e.type, color:e.color, colorStyle:e.colorStyle,
      sections: e.sections.map(s => ({
        id:uid(), teacherName:s.teacherName, autoMode:s.autoMode, attendance:{}, tests:[],
        routine: r.copy === 'routine' ? s.routine.map(x => ({id:uid(), dow:x.dow, time:x.time})) : []
      }))
    }));
  }
  db.terms.push(t);
  db.activeTermId = t.id;
  ui.settingsOpen = true;
  commit(); render();
  showToast('Term created — add its holidays in ⚙');
}
async function deleteTerm(){
  if(db.terms.length <= 1){ showToast('Keep at least one term — add another before deleting this one'); return; }
  const term = curTerm();
  const ok = await askConfirm({
    title:'Delete this term?',
    message:`“${term.name}” and everything in it (attendance, routine, CTs) will be removed. A restore point is saved first, so you can undo this from Settings.`,
    confirmLabel:'Delete term', danger:true
  });
  if(!ok) return;
  await addSnapshot(`Before deleting term “${term.name}”`);
  db.terms = db.terms.filter(t => t.id !== term.id);
  db.activeTermId = db.terms[0].id;
  commit(); render(); showToast('Term deleted');
}

/* ---------------- import / restore / autosave connect ---------------- */
function describeDb(d){
  return d.terms.map(t => `<b>${escapeHtml(t.name)}</b> (${t.entities.length} subjects, from ${fmtShort(t.start)})`).join('<br>');
}
function askImportChoice(imported, fileName){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if(!done){ done = true; resolve(v); } };
    openModal({
      cls:'mid',
      render:() => `<h4>Import “${escapeHtml(fileName)}”</h4>
        <div class="modal-sub">This file contains:<br>${describeDb(imported)}</div>
        <div class="modal-sub">A restore point is saved first either way, so nothing is lost by choosing wrong.</div>
        <div class="modal-actions" style="flex-direction:column">
          <button class="primary" data-choice="add">Add as new term${imported.terms.length > 1 ? 's' : ''} — keep everything I have</button>
          <button class="ghost danger" data-choice="replace">Replace everything I have with this file</button>
          <button class="ghost" data-choice="cancel">Cancel</button>
        </div>`,
      wire:root => root.querySelectorAll('[data-choice]').forEach(b => b.addEventListener('click', () => {
        finish(b.dataset.choice === 'cancel' ? null : b.dataset.choice); closeModal();
      })),
      onClose:() => finish(null)
    });
  });
}
async function handleImportFile(file){
  let imported;
  try{ imported = normalizeDb(JSON.parse(await file.text())); }
  catch(err){
    askConfirm({title:'Could not read that file', message:(err && err.message ? err.message + ' ' : '') + 'Choose a backup or autosave .json file exported from Term Ledger.', confirmLabel:'OK'});
    return;
  }
  const mode = await askImportChoice(imported, file.name);
  if(!mode) return;
  await applyImport(imported, mode);
  ui.perTerm = {};
  render();
  showToast(mode === 'replace' ? 'Backup restored ✓' : 'Term added from file ✓');
}
async function restoreSnapshot(id){
  const snaps = await listSnapshots();
  const snap = snaps.find(s => s.id === id); if(!snap) return;
  const ok = await askConfirm({
    title:'Restore this snapshot?',
    message:`Your data goes back to how it was on ${fmtStamp(snap.at)} (“${snap.label}”). Your current data is saved as a restore point first.`,
    confirmLabel:'Restore'
  });
  if(!ok) return;
  let restored;
  try{ restored = normalizeDb(JSON.parse(snap.json)); }catch(e){ showToast('That snapshot could not be read'); return; }
  await addSnapshot('Before restoring a snapshot');
  restored.settings = db.settings; restored.lastExport = db.lastExport;
  db = restored; ui.perTerm = {};
  commit(); render(); showToast('Snapshot restored ✓');
}
async function connectAutosave(){
  const res = await pickAutosaveFile();
  if(!res) return;
  if(res.existing && res.existing.parsed){
    const imported = res.existing.parsed;
    const choice = await new Promise(resolve => {
      let done = false; const finish = v => { if(!done){ done = true; resolve(v); } };
      openModal({
        cls:'mid',
        render:() => `<h4>That file already has data</h4>
          <div class="modal-sub">It holds a Term Ledger backup${imported.savedAt ? ' saved ' + fmtStamp(imported.savedAt) : ''}:<br>${describeDb(imported)}</div>
          <div class="modal-sub warn">Connecting it as your autosave file will overwrite it with what's in the app right now, unless you load it first.</div>
          <div class="modal-actions" style="flex-direction:column">
            <button class="primary" data-choice="load">Load it into the app (replace what I have), then keep it in sync</button>
            <button class="ghost danger" data-choice="overwrite">Keep what's in the app and overwrite the file</button>
            <button class="ghost" data-choice="cancel">Cancel</button>
          </div>`,
        wire:root => root.querySelectorAll('[data-choice]').forEach(b => b.addEventListener('click', () => { finish(b.dataset.choice); closeModal(); })),
        onClose:() => finish('cancel')
      });
    });
    if(choice === 'cancel') return;
    if(choice === 'load'){
      await applyImport(imported, 'replace'); ui.perTerm = {};
    }
  } else if(res.existing && res.existing.unreadable){
    const ok = await askConfirm({title:'Overwrite this file?', message:'That file has content that is not a Term Ledger backup. Using it will overwrite it.', confirmLabel:'Overwrite', danger:true});
    if(!ok) return;
  }
  await attachAutosaveHandle(res.handle);
  render(); showToast('Autosave file connected ✓');
}

/* ---------------- start-up ---------------- */
async function init(){
  const loaded = await loadDb();
  db = loaded.db;
  if(!db.settings) db.settings = {autoDownloadOnLeave:false};
  commit();
  onFsChange = () => { if(ui.settingsOpen) renderSettings(curTerm(), computeTermInfo(curTerm())); };

  $('termName').addEventListener('change', e => {
    const term = curTerm(); term.name = e.target.value.trim() || 'Untitled term'; commit(); render();
  });
  $('termSelect').addEventListener('change', e => { db.activeTermId = e.target.value; commit(); render(); });
  $('newTermBtn').addEventListener('click', newTerm);
  $('routineBtn').addEventListener('click', () => openModal(routineModalSpec()));
  $('gearBtn').addEventListener('click', () => { ui.settingsOpen = !ui.settingsOpen; render(); });
  $('settingsPanel').addEventListener('click', onSettingsClick);
  $('settingsPanel').addEventListener('change', onSettingsChange);
  $('tabs').addEventListener('click', onTabsClick);
  $('page').addEventListener('click', onPageClick);
  $('page').addEventListener('change', onPageChange);
  $('page').addEventListener('submit', onPageSubmit);
  $('page').addEventListener('keydown', onPageKeydown);
  $('importFile').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if(f) handleImportFile(f);
  });

  await fsInit();
  render();

  if(loaded.migrated){
    await addSnapshot('Imported from the old app version');
    showToast('Your saved data was carried over to the new version ✓');
  } else if(loaded.unreadable){
    askConfirm({title:'Some saved data could not be read', message:'A copy of the unreadable data was kept in browser storage under “term-ledger-unreadable-…”. You can import a backup file from Settings.', confirmLabel:'OK'});
  }
  dailySnapshot();
  if(navigator.storage && navigator.storage.persist){
    try{
      persistState = (await navigator.storage.persisted()) ? 'granted' : ((await navigator.storage.persist()) ? 'granted' : 'denied');
    }catch(e){ persistState = 'unknown'; }
    if(ui.settingsOpen) render();
  }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW registration failed', err));
  }
}
init();

</script>
