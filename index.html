<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Term Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171310">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Term Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@600;700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1015;
    --leather-1:#241c14;
    --leather-2:#171310;
    --paper:#1d2026;
    --paper-2:#20242c;
    --ink:#e9e2cf;
    --ink-soft:#9a9484;
    --line:#3a3f4a;
    --gold:#c9a24d;
    --green:#5fbf86;
    --crimson:#e2645c;
    --gray:#7c8591;
    --holiday:#9b83c9;
    --weekend-stripe:rgba(255,255,255,0.02);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,162,77,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(95,191,134,0.04), transparent 40%);
    font-family:'Libre Franklin', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  /* ---------- Cover ---------- */
  .cover{
    background:linear-gradient(155deg, var(--leather-1) 0%, var(--leather-2) 100%);
    border-radius:10px;
    padding:22px 28px;
    position:relative;
    box-shadow:0 18px 40px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04);
    margin-bottom:18px;
    overflow:hidden;
  }
  .cover::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:30px;
    background:repeating-linear-gradient(180deg, transparent 0 18px, rgba(0,0,0,0.35) 18px 19px);
    opacity:0.6;
  }
  .cover-top{margin-left:20px; display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .eyebrow{
    font-family:'Special Elite', monospace;
    letter-spacing:3px; text-transform:uppercase; font-size:10.5px;
    color:var(--gold); margin:0 0 6px;
  }
  .term-input{
    background:transparent; border:none; border-bottom:1px dashed rgba(233,226,207,0.35);
    color:var(--ink); font-family:'Special Elite', monospace;
    font-size:clamp(22px,3.6vw,32px); padding:0 2px 4px; width:min(420px,58vw);
  }
  .term-input:focus{outline:none; border-bottom-color:var(--gold);}
  .gear-btn{
    background:rgba(233,226,207,0.06); border:1px solid rgba(233,226,207,0.15);
    color:var(--ink); width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
    flex-shrink:0;
  }
  .gear-btn:hover{border-color:var(--gold); color:var(--gold);}

  .stat-cards{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 0 20px;}
  .stat-card{
    background:rgba(233,226,207,0.05); border:1px solid rgba(233,226,207,0.12);
    border-radius:8px; padding:9px 15px; min-width:100px; text-align:center;
  }
  .stat-num{font-family:'Special Elite', monospace; font-size:19px; color:var(--gold);}
  .stat-label{font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; opacity:0.7; margin-top:2px;}

  /* ---------- Settings panel ---------- */
  .settings{
    margin:16px 20px 0; padding:16px; border-radius:8px;
    background:rgba(0,0,0,0.25); border:1px solid rgba(233,226,207,0.1);
    display:none;
  }
  .settings.open{display:block;}
  .settings h3{font-family:'Special Elite', monospace; font-size:13px; letter-spacing:1px; margin:0 0 12px; color:var(--gold);}
  .settings-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .settings label{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .settings input[type=date], .settings input[type=number]{
    background:var(--paper-2); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:6px 9px; font-family:'Libre Franklin'; font-size:13px;
  }
  .settings input[type=number]{width:70px;}
  .holiday-row{display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap;}
  .holiday-row span{color:var(--ink-soft); font-size:12px;}
  .icon-btn{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:14px; padding:2px 6px;
  }
  .icon-btn:hover{color:var(--crimson);}
  .add-holiday{
    background:none; border:1px dashed var(--line); color:var(--ink-soft); border-radius:6px;
    padding:6px 12px; font-size:12px; cursor:pointer; margin-top:4px;
  }
  .add-holiday:hover{border-color:var(--gold); color:var(--gold);}
  .term-summary{font-size:12px; color:var(--ink-soft); margin-top:8px;}
  .term-summary b{color:var(--ink);}

  /* ---------- Layout ---------- */
  .body-grid{display:grid; grid-template-columns:250px 1fr; gap:0; align-items:start;}
  @media (max-width:780px){ .body-grid{grid-template-columns:1fr;} }

  /* ---------- Tabs ---------- */
  .tab-group-label{
    font-family:'Special Elite', monospace; font-size:10.5px; letter-spacing:2px; text-transform:uppercase;
    color:var(--ink-soft); margin:14px 0 6px 6px;
  }
  .tab-group-label:first-child{margin-top:0;}
  .tabs{display:flex; flex-direction:column; gap:5px;}
  .tab{
    position:relative; background:var(--paper); border:1px solid var(--line); border-right:none;
    border-radius:8px 0 0 8px; padding:9px 12px; cursor:pointer; font-size:13px; color:var(--ink-soft);
    transform:translateX(6px); transition:transform 0.15s ease, background 0.15s ease;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .tab:hover{transform:translateX(0px); background:var(--paper-2);}
  .tab.active{background:var(--paper-2); color:var(--ink); transform:translateX(0px);
    box-shadow:-2px 0 10px rgba(0,0,0,0.3); border-color:var(--gold);}
  .tab-main{display:flex; align-items:center; gap:8px; overflow:hidden;}
  .tab .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tab-code{font-weight:700; font-size:12px;}
  .tab-name{font-size:10.5px; opacity:0.75; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tab-pct{font-family:'Special Elite', monospace; font-size:11px; flex-shrink:0;}
  .tab-del{background:none;border:none;color:var(--ink-soft);opacity:0;cursor:pointer;font-size:13px;padding:2px;}
  .tab:hover .tab-del{opacity:0.5;}
  .tab-del:hover{opacity:1 !important; color:var(--crimson);}
  .add-tab{
    background:transparent; border:1px dashed var(--line); border-radius:8px; padding:9px;
    color:var(--ink-soft); font-size:12px; cursor:pointer; margin-top:8px; transform:translateX(6px); opacity:0.8;
  }
  .add-tab:hover{opacity:1; border-color:var(--gold); color:var(--gold);}

  /* ---------- Page ---------- */
  .page{
    background:var(--paper-2);
    border-radius:0 10px 10px 10px;
    padding:24px 26px 28px;
    box-shadow:0 14px 34px rgba(0,0,0,0.5);
    min-height:420px;
  }
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .stamp-icon{font-size:38px; margin-bottom:10px;}

  .page-head{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;
    border-bottom:2px solid var(--line); padding-bottom:12px; margin-bottom:14px;
  }
  .subject-title{font-family:'Special Elite', monospace; font-size:19px; display:flex; align-items:center; gap:10px;}
  .subject-title .dot{width:11px;height:11px;border-radius:50%;}
  .subject-sub{font-size:11.5px; color:var(--ink-soft); margin-top:3px; margin-left:21px;}

  .section-pills{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .pill{
    background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:6px 14px 6px 14px;
    font-size:12.5px; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; gap:6px;
  }
  .pill:hover{border-color:var(--gold);}
  .pill.active{background:var(--gold); color:#211a0e; border-color:var(--gold); font-weight:700;}
  .pill .edit-ic{opacity:0.5; font-size:11px;}
  .pill.active .edit-ic{opacity:0.6;}

  .month-nav{display:flex; align-items:center; gap:10px; font-family:'Special Elite', monospace; font-size:13px;}
  .month-nav button{
    background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:5px;
    width:25px;height:25px; cursor:pointer; font-size:13px;
  }
  .month-nav button:hover{border-color:var(--gold); color:var(--gold);}

  .section-label{
    font-family:'Special Elite', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--ink-soft); margin:6px 0 12px; display:flex; align-items:center; gap:10px;
  }
  .section-label::after{content:""; flex:1; height:1px; background:var(--line);}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:8px;}
  .cal-dow{text-align:center; font-size:9.5px; letter-spacing:1px; color:var(--ink-soft); font-weight:700; padding-bottom:2px;}
  .cal-cell{
    aspect-ratio:1/1; border:1.5px dashed var(--line); border-radius:6px;
    display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer;
    background:rgba(255,255,255,0.015); transition:transform 0.08s ease; user-select:none;
  }
  .cal-cell.blank{border:none; cursor:default; background:none;}
  .cal-cell .num{font-size:11px; color:var(--ink-soft); position:absolute; top:3px; left:5px;}
  .cal-cell:active{transform:scale(0.92);}
  .cal-cell.outside-term{opacity:0.55;}
  .cal-cell.blocked-off{
    background:rgba(226,100,92,0.14);
    background-image:repeating-linear-gradient(45deg, rgba(226,100,92,0.22) 0 5px, transparent 5px 10px);
    border-color:rgba(226,100,92,0.45); cursor:not-allowed;
  }
  .cal-cell.blocked-off .num{color:var(--crimson); opacity:0.75;}

  .stamp{
    font-family:'Caveat', cursive; font-weight:700; font-size:14px; letter-spacing:1px;
    padding:2px 7px; border:2.5px solid currentColor; border-radius:5px; transform:rotate(-9deg);
    animation:slam 0.22s ease; filter:url(#inkTexture);
  }
  .stamp.present{color:var(--green);}
  .stamp.absent{color:var(--crimson);}
  .stamp.cancelled{color:var(--gray); transform:rotate(6deg);}
  @keyframes slam{0%{transform:scale(2.4) rotate(-9deg); opacity:0;} 60%{transform:scale(0.9) rotate(-9deg); opacity:1;} 100%{transform:scale(1) rotate(-9deg); opacity:1;}}

  .multi-stamp{display:flex; gap:3px; flex-wrap:wrap; justify-content:center; align-items:center; padding-top:5px; max-width:80%;}
  .mini-dot{width:7px;height:7px;border-radius:50%;}
  .mini-dot.present{background:var(--green);}
  .mini-dot.absent{background:var(--crimson);}
  .mini-dot.cancelled{background:var(--gray);}

  .cal-legend{display:flex; gap:14px; font-size:10.5px; color:var(--ink-soft); margin:0 0 20px; flex-wrap:wrap;}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .leg-dot{width:9px;height:9px;border-radius:50%;}
  .leg-note{width:100%; font-size:10px; opacity:0.7; margin-top:2px;}

  /* ---------- Day modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px;}
  .modal-card{background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:20px; width:100%; max-width:340px; box-shadow:0 20px 50px rgba(0,0,0,0.6);}
  .modal-card h4{font-family:'Special Elite', monospace; font-size:15px; margin:0 0 4px; color:var(--ink);}
  .modal-sub{font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;}
  .modal-entries{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .modal-entry{display:flex; align-items:center; justify-content:space-between; background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px;}
  .modal-entry-status{display:flex; align-items:center; gap:8px;}
  .modal-entry-dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
  .modal-add-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .modal-add-btn{flex:1; min-width:80px; border:1.5px solid var(--line); background:var(--paper); border-radius:6px; padding:9px 6px; font-size:12px; cursor:pointer; font-weight:700; color:var(--ink);}
  .modal-add-btn.present{color:var(--green); border-color:var(--green);}
  .modal-add-btn.absent{color:var(--crimson); border-color:var(--crimson);}
  .modal-add-btn.cancelled{color:var(--gray); border-color:var(--gray);}
  .modal-add-btn:hover{filter:brightness(1.4);}
  .modal-close{width:100%; text-align:center; margin-top:4px;}

  .attendance-bar-wrap{margin-bottom:14px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap;}
  .attendance-bar{flex:1; min-width:120px; height:8px; background:var(--line); border-radius:6px; overflow:hidden;}
  .attendance-bar > div{height:100%; background:var(--green); transition:width 0.4s ease;}
  .attendance-bar.low > div{background:var(--crimson);}

  .marks-cap-wrap{margin-bottom:14px; font-size:12px; color:var(--ink-soft);}
  .marks-cap-bar{height:7px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:5px;}
  .marks-cap-bar > div{height:100%; background:var(--gold); transition:width 0.4s ease;}
  .marks-cap-bar.over > div{background:var(--crimson);}

  .test-table{width:100%; border-collapse:collapse; font-size:13px;}
  .test-table th{
    text-align:left; font-family:'Special Elite', monospace; font-weight:400; font-size:10.5px;
    letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); border-bottom:2px solid var(--line); padding:6px 8px;
  }
  .test-table td{padding:8px 8px; border-bottom:1px solid var(--line);}
  .test-table tr:hover td{background:rgba(201,162,77,0.05);}
  .grade-pill{display:inline-block; padding:2px 9px; border-radius:20px; font-weight:700; font-size:11.5px;}
  .del-row{background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:13px;}
  .del-row:hover{color:var(--crimson);}

  .add-form{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft);}
  .field input{
    border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px;
    padding:7px 9px; font-size:13px; font-family:'Libre Franklin'; width:110px;
  }
  .field input.wide{width:170px;}
  .field input:focus{outline:1.5px solid var(--gold); outline-offset:1px;}

  button.primary{background:var(--gold); color:#211a0e; border:none; border-radius:6px; padding:9px 16px; font-weight:700; font-size:12.5px; cursor:pointer;}
  button.primary:hover{filter:brightness(1.1);}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft); border-radius:6px; padding:7px 13px; font-size:12.5px; cursor:pointer;}
  button.ghost:hover{border-color:var(--gold); color:var(--gold);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--gold); color:#211a0e; padding:10px 18px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:all 0.25s ease; font-family:'Special Elite', monospace; z-index:50; font-weight:700;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .footnote{text-align:center; color:rgba(233,226,207,0.25); font-size:10.5px; margin-top:16px; font-family:'Special Elite', monospace;}

  /* =====================  v2 additions  ===================== */
  html{-webkit-text-size-adjust:100%;}
  body{padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); padding-top:max(28px, env(safe-area-inset-top));}
  button, select, input{font-family:'Libre Franklin', sans-serif;}
  button{-webkit-tap-highlight-color:transparent;}

  /* ---- term bar ---- */
  .term-bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px;}
  select, input, textarea{color-scheme:dark;}
  .term-bar select, .settings select, .modal-field select, .auto-select, .rt-add select{
    background:var(--paper-2); border:1px solid var(--line); color:var(--ink); border-radius:6px;
    padding:6px 9px; font-size:13px; max-width:100%;
  }
  .term-bar select{min-width:150px;}
  button.small{padding:6px 11px; font-size:12px;}
  button.danger{border-color:rgba(226,100,92,0.55); color:var(--crimson);}
  button.danger:hover{border-color:var(--crimson); color:#ff8f87; background:rgba(226,100,92,0.08);}
  button.primary.danger{background:var(--crimson); color:#1a0c0b; border:none;}
  button:disabled{opacity:0.45; cursor:not-allowed;}

  /* ---- settings extras ---- */
  .settings-block{margin-top:16px; padding-top:14px; border-top:1px solid rgba(233,226,207,0.1);}
  .settings-block:first-of-type{margin-top:0; padding-top:0; border-top:none;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .settings .note{font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:8px;}
  .settings .note b{color:var(--ink);}
  .settings .note.warn{color:#e0b36a;}
  .check-row{display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-top:10px; cursor:pointer; line-height:1.4;}
  .check-row input{margin-top:2px;}
  .snap-list{display:flex; flex-direction:column; gap:5px; margin-top:8px; max-height:190px; overflow:auto;}
  .snap-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; color:var(--ink-soft);}
  .snap-row b{color:var(--ink); font-weight:600;}

  /* ---- auto-filled attendance ---- */
  .stamp.auto{opacity:0.62; border-style:dashed; animation:none;}
  .mini-dot.auto{background:transparent !important; border:1.5px solid currentColor; width:8px; height:8px;}
  .mini-dot.present.auto{color:var(--green);}
  .mini-dot.absent.auto{color:var(--crimson);}
  .mini-dot.cancelled.auto{color:var(--gray);}
  .sched-dots{position:absolute; bottom:4px; left:0; right:0; display:flex; gap:3px; justify-content:center;}
  .sched-dot{width:6px; height:6px; border-radius:50%; border:1.5px solid var(--ink-soft); opacity:0.55;}
  .cal-cell.today{border-style:solid; border-color:var(--gold);}
  .cal-cell.today .num{color:var(--gold); font-weight:700;}

  /* ---- routine summary box ---- */
  .routine-box{
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin-bottom:14px; font-size:12px; color:var(--ink-soft);
  }
  .routine-box b{color:var(--ink);}
  .routine-box .rb-left{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .routine-box .rb-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .auto-select{font-size:12px; padding:5px 8px;}

  /* ---- modals (wider / scrollable variants) ---- */
  .modal-card{max-height:calc(100vh - 32px); overflow:auto;}
  .modal-card.wide{max-width:560px;}
  .modal-card.mid{max-width:430px;}
  .modal-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .modal-actions > button{flex:1; min-width:110px;}
  .modal-field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  .modal-field label{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft);}
  .modal-field input[type=text], .modal-field input[type=date], .modal-field input[type=number], .modal-field input[type=time]{
    border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px; padding:8px 10px; font-size:14px; width:100%;
  }
  .modal-field input:focus, .modal-field select:focus{outline:1.5px solid var(--gold); outline-offset:1px;}
  .modal-field .hint{font-size:11px; color:var(--ink-soft); line-height:1.4;}
  .modal-check{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink); margin-bottom:12px; cursor:pointer;}
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;}

<script>
'use strict';
/* =====================================================================
   THE TERM LEDGER  v2
   Data model:  db = { version, savedAt, activeTermId, terms:[term], settings, lastExport }
   term       = { id, name, start, totalClassDays, holidays[], autoMode, entities[] }
   entity     = { id, code, name, type:'course'|'lab', color, colorStyle, sections[] }
   section    = { id, teacherName, routine[], autoMode, attendance{date:[entry]}, tests[] }
   routine    = { id, dow(0-4), time }
   entry      = { s:'present'|'absent'|'cancelled', rid?:routineSlotId, x?:true(extra class) }
   test (CT)  = { id, name, max, date, marks:number|null }   (null = not published yet)
   ===================================================================== */

/* ---------------- constants ---------------- */
const LS_KEY = 'term-ledger-db-v2';
const LEGACY_LS_KEY = 'bme-ledger-state';      // data written by the v1 app
const IDB_NAME = 'term-ledger';
const PALETTE = ['#4caf7d','#e2645c','#9b7fd4','#5b8def','#e2984f','#c9a24d','#d46fa8','#4fc3c9'];
const STATUSES = ['present','absent','cancelled'];
const AUTO_MODES = ['present','absent','cancelled','off'];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WORK_DAYS = [0,1,2,3,4];                  // Sunday-Thursday; Fri/Sat are the weekend

// Course colours are solid dots; a lab shares its course's hue but renders as a ring.
const SUBJECT_STYLES = {
  'BME 3211': {color:'#4caf7d', style:'solid'},
  'BME 3213': {color:'#e2645c', style:'solid'},
  'BME 3231': {color:'#9b7fd4', style:'solid'},
  'BME 3232': {color:'#9b7fd4', style:'ring'},
  'BME 3241': {color:'#5b8def', style:'solid'},
  'BME 3242': {color:'#5b8def', style:'ring'},
  'ECE 3215': {color:'#e2984f', style:'solid'},
  'ECE 3216': {color:'#e2984f', style:'ring'},
};
const DEFAULT_ENTITIES = [
  {code:'BME 3211', name:'Biomaterials and Prosthetics', type:'course'},
  {code:'BME 3213', name:'Biomechanics', type:'course'},
  {code:'BME 3231', name:'Biomedical Devices and Control', type:'course'},
  {code:'BME 3232', name:'Biomedical Devices and Control Laboratory', type:'lab'},
  {code:'BME 3241', name:'Magnetic and Nuclear Imaging', type:'course'},
  {code:'BME 3242', name:'Magnetic and Nuclear Imaging Laboratory', type:'lab'},
  {code:'ECE 3215', name:'Body Sensor Networks', type:'course'},
  {code:'ECE 3216', name:'Body Sensor Networks Laboratory', type:'lab'},
];
const DEFAULT_HOLIDAYS = [
  ['2026-08-26','2026-08-26'], ['2026-09-01','2026-09-01'], ['2026-10-16','2026-10-24'],
  ['2026-12-14','2026-12-14'], ['2026-12-16','2026-12-16'], ['2026-12-25','2026-12-31'],
];

/* ---------------- tiny utils ---------------- */
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function dateToISO(d){ return isoDate(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayISO(){ return dateToISO(new Date()); }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDaysISO(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return dateToISO(d); }
function isISO(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseISO(s)); }
function fmtShort(iso){ return parseISO(iso).toLocaleDateString('default',{month:'short', day:'numeric'}); }
function fmtLong(iso){ return parseISO(iso).toLocaleDateString('default',{weekday:'long', month:'long', day:'numeric'}); }
function fmtStamp(ms){ return new Date(ms).toLocaleString('default',{month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
function nextSundayISO(){ const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7)); return dateToISO(d); }
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------------- model factories ---------------- */
function makeSection(teacherName){
  return {id:uid(), teacherName, routine:[], autoMode:null, attendance:{}, tests:[]};
}
function makeEntity({code, name, type, color, colorStyle}){
  return {
    id:uid(), code, name, type,
    color: color || PALETTE[0],
    colorStyle: colorStyle || (type === 'lab' ? 'ring' : 'solid'),
    sections: type === 'course' ? [makeSection('Teacher A'), makeSection('Teacher B')] : [makeSection(null)]
  };
}
function makeTerm({name, start, totalClassDays, holidays, entities, autoMode}){
  return {
    id:uid(), name, start, totalClassDays,
    holidays: (holidays || []).map(h => ({id:uid(), start:h[0], end:h[1]})),
    autoMode: autoMode || 'present',
    entities: entities || []
  };
}
function defaultTerm(){
  return makeTerm({
    name:'BME Term — Aug 2026', start:'2026-08-23', totalClassDays:68,
    holidays: DEFAULT_HOLIDAYS,
    entities: DEFAULT_ENTITIES.map((e,i) => {
      const st = SUBJECT_STYLES[e.code] || {color:PALETTE[i % PALETTE.length], style:'solid'};
      return makeEntity({...e, color:st.color, colorStyle:st.style});
    })
  });
}
function defaultDb(){
  const t = defaultTerm();
  return {version:2, savedAt:0, activeTermId:t.id, terms:[t], settings:{autoDownloadOnLeave:false}, lastExport:null};
}

/* ---------------- normalisation / migration ----------------
   Accepts: v2 files ({terms:[...]}), v1 files/state ({term, entities}), and
   old attendance shapes (string, or array of strings per day).            */
function normTest(t){
  if(!t || typeof t !== 'object') return null;
  let marks = null;
  if(t.marks !== null && t.marks !== undefined && t.marks !== ''){
    const n = Number(t.marks);
    if(Number.isFinite(n)) marks = n;
  }
  let max = Number(t.max);
  if(!Number.isFinite(max) || max <= 0) max = 100;
  return {id:t.id || uid(), name:String(t.name || 'CT'), max, date: isISO(t.date) ? t.date : '', marks};
}
function normAttendance(att){
  const out = {};
  if(!att || typeof att !== 'object') return out;
  for(const [date, v] of Object.entries(att)){
    if(!isISO(date)) continue;
    const arr = Array.isArray(v) ? v : [v];
    const res = [];
    arr.forEach(e => {
      if(typeof e === 'string'){ if(STATUSES.includes(e)) res.push({s:e}); }
      else if(e && STATUSES.includes(e.s)){
        const ne = {s:e.s};
        if(e.x) ne.x = true;
        else if(e.rid) ne.rid = String(e.rid);
        res.push(ne);
      }
    });
    if(res.length) out[date] = res;
  }
  return out;
}
function normSection(s, type){
  s = s || {};
  return {
    id: s.id || uid(),
    teacherName: type === 'course' ? String(s.teacherName || 'Teacher') : null,
    routine: (Array.isArray(s.routine) ? s.routine : [])
      .filter(r => r && Number.isInteger(r.dow) && r.dow >= 0 && r.dow <= 4)
      .map(r => ({id:r.id || uid(), dow:r.dow, time:String(r.time || '').slice(0,20)})),
    autoMode: AUTO_MODES.includes(s.autoMode) ? s.autoMode : null,
    attendance: normAttendance(s.attendance),
    tests: (Array.isArray(s.tests) ? s.tests : []).map(normTest).filter(Boolean)
  };
}
function normEntity(e, legacy){
  e = e || {};
  let code = String(e.code || 'Subject');
  if(code === 'BME 3214') code = 'BME 3232';                 // renamed lab keeps its records
  const type = e.type === 'lab' ? 'lab' : 'course';
  const known = SUBJECT_STYLES[code];
  const color = (legacy && known) ? known.color : (e.color || (known && known.color) || PALETTE[0]);
  const colorStyle = (legacy && known) ? known.style : (e.colorStyle === 'ring' ? 'ring' : (e.colorStyle === 'solid' ? 'solid' : (known ? known.style : (type === 'lab' ? 'ring' : 'solid'))));
  let sections = (Array.isArray(e.sections) ? e.sections : []).map(s => normSection(s, type));
  if(!sections.length) sections = makeEntity({code, name:'', type}).sections;
  return {id:e.id || uid(), code, name:String(e.name || ''), type, color, colorStyle, sections};
}
function normTerm(t, legacy){
  t = t || {};
  const start = isISO(t.start) ? t.start : todayISO();
  let days = parseInt(t.totalClassDays, 10);
  if(!(days > 0)) days = 60;
  const holidays = (Array.isArray(t.holidays) ? t.holidays : [])
    .filter(h => h && isISO(h.start))
    .map(h => { const end = isISO(h.end) && h.end >= h.start ? h.end : h.start; return {id:h.id || uid(), start:h.start, end}; });
  return {
    id: t.id || uid(),
    name: String(t.name || 'Untitled term'),
    start, totalClassDays: days, holidays,
    autoMode: AUTO_MODES.includes(t.autoMode) ? t.autoMode : 'present',
    entities: (Array.isArray(t.entities) ? t.entities : []).map(e => normEntity(e, legacy))
  };
}
function normalizeDb(raw){
  if(!raw || typeof raw !== 'object') throw new Error('This is not a Term Ledger file.');
  let terms, legacy = false;
  if(Array.isArray(raw.terms)){
    terms = raw.terms.map(t => normTerm(t, false));
  } else if(raw.term && Array.isArray(raw.entities)){
    legacy = true;                                         // v1 single-term state
    terms = [normTerm({...raw.term, entities: raw.entities}, true)];
  } else {
    throw new Error('This is not a Term Ledger file.');
  }
  if(!terms.length) throw new Error('This file does not contain any terms.');
  const seen = new Set();
  terms.forEach(t => { while(seen.has(t.id)) t.id = uid(); seen.add(t.id); });
  const s = raw.settings || {};
  return {
    version: 2,
    savedAt: Number(raw.savedAt) || 0,
    activeTermId: terms.some(t => t.id === raw.activeTermId) ? raw.activeTermId : terms[0].id,
    terms,
    settings: {autoDownloadOnLeave: !!s.autoDownloadOnLeave},
    lastExport: Number(raw.lastExport) || null
  };
}

/* ---------------- IndexedDB (in-app database) ---------------- */
let idbPromise = null, idbOk = true;
function idb(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    if(typeof indexedDB === 'undefined'){ reject(new Error('no indexedDB')); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ reject(e); return; }
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('snapshots')) d.createObjectStore('snapshots', {keyPath:'id'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('blocked'));
  }).catch(() => { idbOk = false; return null; });
  return idbPromise;
}
function idbTx(store, mode, fn){
  return idb().then(d => {
    if(!d) return null;
    return new Promise((resolve, reject) => {
      let result;
      const tx = d.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      if(req && 'onsuccess' in req) req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  });
}
const idbGet = (store, key) => idbTx(store, 'readonly', s => s.get(key));
const idbAll = (store) => idbTx(store, 'readonly', s => s.getAll());
const idbPut = (store, val, key) => idbTx(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key));
const idbDel = (store, key) => idbTx(store, 'readwrite', s => s.delete(key));

/* ---------------- persistence ---------------- */
let db = null;
let lsOk = true;
let dirtySinceBackup = false;
let idbWriteChain = Promise.resolve();
let persistState = 'unknown';          // 'granted' | 'denied' | 'unknown'

function commit(){
  db.savedAt = Date.now();
  const json = JSON.stringify(db);
  try{ localStorage.setItem(LS_KEY, json); lsOk = true; }catch(e){ lsOk = false; }
  const at = db.savedAt;
  idbWriteChain = idbWriteChain.then(() => idbPut('kv', {json, savedAt:at}, 'db')).catch(() => {});
  dirtySinceBackup = true;
  queueAutosaveFile();
}

function stashUnreadable(raw){
  try{ localStorage.setItem('term-ledger-unreadable-' + Date.now(), raw); }catch(e){}
}

async function loadDb(){
  const found = [];
  let sawData = false, unreadable = false;
  try{
    const rec = await idbGet('kv', 'db');
    if(rec && rec.json){
      sawData = true;
      try{ found.push({savedAt:rec.savedAt || 0, db:normalizeDb(JSON.parse(rec.json))}); }
      catch(e){ unreadable = true; stashUnreadable(rec.json); }
    }
  }catch(e){}
  try{
    const s = localStorage.getItem(LS_KEY);
    if(s){
      sawData = true;
      try{ const p = JSON.parse(s); found.push({savedAt:Number(p.savedAt) || 0, db:normalizeDb(p)}); }
      catch(e){ unreadable = true; stashUnreadable(s); }
    }
  }catch(e){}
  if(found.length){
    found.sort((a,b) => b.savedAt - a.savedAt);
    return {db:found[0].db, unreadable};
  }
  // nothing from v2 -> look for data written by the previous (v1) app
  try{
    const s = localStorage.getItem(LEGACY_LS_KEY);
    if(s) return {db:normalizeDb(JSON.parse(s)), migrated:true};
  }catch(e){}
  return {db:defaultDb(), fresh:true, unreadable: unreadable || sawData};
}

/* ---------------- restore points (snapshots) ---------------- */
async function addSnapshot(label){
  if(!db) return;
  const at = Date.now();
  await idbPut('snapshots', {id:at + Math.floor(Math.random()*9), at, label, json:JSON.stringify(db)}).catch(() => {});
  pruneSnapshots();
}
async function listSnapshots(){
  const all = await idbAll('snapshots').catch(() => null);
  return (all || []).sort((a,b) => b.at - a.at);
}
async function pruneSnapshots(){
  const all = await listSnapshots();
  for(const r of all.slice(30)) await idbDel('snapshots', r.id).catch(() => {});
}
async function dailySnapshot(){
  const today = todayISO();
  let last = null;
  try{ last = localStorage.getItem('term-ledger-last-daily'); }catch(e){}
  if(last === today) return;
  await addSnapshot('Daily snapshot');
  try{ localStorage.setItem('term-ledger-last-daily', today); }catch(e){}
}

/* ---------------- export / import ---------------- */
function downloadJson(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportAll(){
  downloadJson(`term-ledger-all-${todayISO()}.json`, db);
  db.lastExport = Date.now(); dirtySinceBackup = false; commit(); dirtySinceBackup = false;
}
function exportTerm(term){
  const safe = term.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'term';
  downloadJson(`term-ledger-${safe}-${todayISO()}.json`, {...db, terms:[term], activeTermId:term.id});
  db.lastExport = Date.now(); commit(); dirtySinceBackup = false;
}
async function applyImport(imported, mode){
  await addSnapshot(mode === 'replace' ? 'Before import (replace all)' : 'Before import (add terms)');
  if(mode === 'replace'){
    imported.settings = db.settings;
    imported.lastExport = db.lastExport;
    db = imported;
  } else {
    const existing = new Set(db.terms.map(t => t.id));
    imported.terms.forEach(t => {
      if(existing.has(t.id)){ t.id = uid(); t.name = t.name + ' (imported)'; }
      existing.add(t.id);
      db.terms.push(t);
    });
    db.activeTermId = imported.terms[0].id;
  }
  commit();
}

/* ---------------- live autosave file (File System Access API) ---------------- */
const FS_SUPPORTED = typeof window.showSaveFilePicker === 'function';
const IS_BRAVE = !!(navigator.brave);
let fsHandle = null;
let fsState = 'none';                   // none | active | needs-permission | error
let fsTimer = null, fsChain = Promise.resolve(), fsLastWrite = null, fsAskedThisSession = false;
let onFsChange = () => {};

// The previous app version kept its autosave-file handle in a different database; carry it over.
function legacyAutosaveHandle(){
  return new Promise(resolve => {
    try{
      const req = indexedDB.open('term-ledger-fs');
      req.onerror = () => resolve(null);
      req.onupgradeneeded = () => { try{ req.transaction.abort(); }catch(e){} resolve(null); };  // db did not exist
      req.onsuccess = () => {
        const d = req.result;
        if(!d.objectStoreNames.contains('handles')){ d.close(); resolve(null); return; }
        const r = d.transaction('handles', 'readonly').objectStore('handles').get('autosave');
        r.onsuccess = () => { d.close(); resolve(r.result || null); };
        r.onerror = () => { d.close(); resolve(null); };
      };
    }catch(e){ resolve(null); }
  });
}
async function fsInit(){
  if(!FS_SUPPORTED) return;
  try{
    let h = await idbGet('kv', 'autosaveHandle');
    if(!h){
      h = await legacyAutosaveHandle();
      if(h) await idbPut('kv', h, 'autosaveHandle').catch(() => {});
    }
    if(!h) return;
    fsHandle = h;
    const p = await h.queryPermission({mode:'readwrite'});
    fsState = p === 'granted' ? 'active' : 'needs-permission';
  }catch(e){ fsState = 'error'; }
}
function queueAutosaveFile(){
  if(!fsHandle) return;
  clearTimeout(fsTimer);
  fsTimer = setTimeout(() => { fsChain = fsChain.then(writeAutosaveFile); }, 500);
}
async function writeAutosaveFile(){
  if(!fsHandle) return;
  try{
    const p = await fsHandle.queryPermission({mode:'readwrite'});
    if(p !== 'granted'){ fsState = 'needs-permission'; onFsChange(); return; }
    const w = await fsHandle.createWritable();
    await w.write(JSON.stringify(db, null, 2));
    await w.close();
    fsState = 'active'; fsLastWrite = Date.now(); dirtySinceBackup = false;
  }catch(e){ console.warn('autosave write failed', e); fsState = 'error'; }
  onFsChange();
}
// after a browser restart the permission must be re-granted by a tap; ask once, on the first tap
document.addEventListener('pointerdown', async () => {
  if(!fsHandle || fsState !== 'needs-permission' || fsAskedThisSession) return;
  fsAskedThisSession = true;
  try{
    const p = await fsHandle.requestPermission({mode:'readwrite'});
    if(p === 'granted'){ fsState = 'active'; await writeAutosaveFile(); }
  }catch(e){}
  onFsChange();
}, true);

async function pickAutosaveFile(){
  if(!FS_SUPPORTED) return null;
  let h;
  try{
    h = await window.showSaveFilePicker({
      suggestedName: 'term-ledger-live-backup.json',
      types: [{description:'Term Ledger backup', accept:{'application/json':['.json']}}]
    });
    const p = await h.requestPermission({mode:'readwrite'});
    if(p !== 'granted') return null;
  }catch(e){ return null; }               // picker cancelled
  let existing = null;                      // peek at what is already in the file BEFORE touching it
  try{
    const f = await h.getFile();
    if(f.size > 0){
      const txt = await f.text();
      try{ existing = {parsed: normalizeDb(JSON.parse(txt))}; }catch(e){ existing = {unreadable:true}; }
    }
  }catch(e){}
  return {handle:h, existing};
}
async function attachAutosaveHandle(h){
  fsHandle = h; fsState = 'active';
  await idbPut('kv', h, 'autosaveHandle').catch(() => {});
  await writeAutosaveFile();
}
async function detachAutosaveHandle(){
  fsHandle = null; fsState = 'none';
  await idbDel('kv', 'autosaveHandle').catch(() => {});
  onFsChange();
}

/* ---------------- optional "download a backup when I leave" ---------------- */
function leaveSave(){
  if(!db || !db.settings.autoDownloadOnLeave) return;
  if(fsHandle && fsState === 'active') return;
  if(!dirtySinceBackup) return;
  downloadJson(`term-ledger-autosave-${todayISO()}.json`, db);
  dirtySinceBackup = false;
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') leaveSave(); });
window.addEventListener('pagehide', leaveSave);

/* =====================================================================
   LOGIC: term calendar, routine auto-fill, attendance & CT maths
   ===================================================================== */

function curTerm(){ return db.terms.find(t => t.id === db.activeTermId) || db.terms[0]; }

function expandHolidaySet(term){
  const set = new Set();
  term.holidays.forEach(h => {
    let d = parseISO(h.start);
    const end = parseISO(h.end);
    for(let i = 0; i < 400 && d <= end; i++){ set.add(dateToISO(d)); d.setDate(d.getDate()+1); }
  });
  return set;
}

/* Walks forward from the start date counting Sun-Thu non-holiday days until the term's
   class-day total is reached. Also lists every calendar date up to yesterday (the days
   routine auto-fill is allowed to touch). */
function computeTermInfo(term){
  const holidaySet = expandHolidaySet(term);
  const d = parseISO(term.start);
  let count = 0, endIso = term.start;
  const classDates = [];
  for(let i = 0; i < 800 && count < term.totalClassDays; i++){
    const iso = dateToISO(d), dow = d.getDay();
    if(dow !== 5 && dow !== 6 && !holidaySet.has(iso)){ count++; endIso = iso; classDates.push(iso); }
    d.setDate(d.getDate()+1);
  }
  const today = todayISO();
  const yesterday = addDaysISO(today, -1);
  const lastAuto = yesterday < endIso ? yesterday : endIso;
  const rangeDates = [];
  if(term.start <= lastAuto){
    let x = term.start;
    for(let i = 0; i < 900 && x <= lastAuto; i++){ rangeDates.push(x); x = addDaysISO(x, 1); }
  }
  return {holidaySet, endIso, classDates, today, rangeDates};
}

function listSections(term){
  const out = [];
  term.entities.forEach(ent => ent.sections.forEach(sec => out.push({ent, sec})));
  return out;
}
function sectionLabel(ent, sec){
  return ent.type === 'course' ? `${ent.code} · ${sec.teacherName}` : `${ent.code} (Lab)`;
}
function effectiveAutoMode(term, sec){ return sec.autoMode || term.autoMode || 'off'; }
function autoModeLabel(mode){
  return {present:'Present', absent:'Absent', cancelled:'Cancelled (not counted)', off:"Don't auto-fill"}[mode] || mode;
}
function byTime(a, b){ return (a.time || '~').localeCompare(b.time || '~') || a.id.localeCompare(b.id); }

/* Everything the UI needs to know about one section on one date.
   - slots: the routine's classes for that weekday, each with the status it ends up with
            (explicit if you logged it, otherwise the auto-fill status for days that have passed)
   - others: extra classes / unmatched entries you logged yourself
   - list: the flat list of counted-or-not statuses for the calendar and the maths        */
function dayInfo(term, info, section, iso){
  const dow = parseISO(iso).getDay();
  const blocked = dow === 5 || dow === 6 || info.holidaySet.has(iso);
  const entries = section.attendance[iso] || [];
  const inTerm = iso >= term.start && iso <= info.endIso;
  const slotsDef = (blocked || !inTerm) ? [] : section.routine.filter(r => r.dow === dow).slice().sort(byTime);
  const ids = new Set(slotsDef.map(r => r.id));
  const mode = effectiveAutoMode(term, section);
  const autoOk = !blocked && mode !== 'off' && iso >= term.start && iso <= info.endIso && iso < info.today;

  const byRid = {};
  entries.forEach((e, idx) => { if(!e.x && e.rid && ids.has(e.rid)) byRid[e.rid] = idx; });
  // entries from older versions (no slot id) fill the day's unfilled slots in order
  const looseIdx = [];
  entries.forEach((e, idx) => { if(!e.x && !(e.rid && ids.has(e.rid))) looseIdx.push(idx); });
  let li = 0;
  const slots = slotsDef.map(r => {
    let idx = byRid[r.id];
    if(idx === undefined && li < looseIdx.length) idx = looseIdx[li++];
    if(idx !== undefined){
      return {id:r.id, time:r.time, status:entries[idx].s, auto:false, explicit:true, entryIdx:idx};
    }
    return {id:r.id, time:r.time, status: autoOk ? mode : null, auto:autoOk, explicit:false, entryIdx:null};
  });
  const others = [];
  entries.forEach((e, idx) => {
    const used = slots.some(s => s.entryIdx === idx);
    if(!used) others.push({idx, s:e.s, extra:!!e.x});
  });
  const list = [];
  slots.forEach(s => { if(s.status) list.push({s:s.status, auto:s.auto}); });
  others.forEach(o => list.push({s:o.s, auto:false}));
  return {iso, dow, blocked, slots, others, list, N:slots.length, mode, autoOk};
}

/* Attendance totals for one section. Cancelled classes are tracked but never counted. */
function sectionStats(term, info, section){
  let present = 0, absent = 0, cancelled = 0, auto = 0;
  const dates = new Set(Object.keys(section.attendance));
  if(section.routine.length && effectiveAutoMode(term, section) !== 'off') info.rangeDates.forEach(d => dates.add(d));
  dates.forEach(iso => {
    dayInfo(term, info, section, iso).list.forEach(it => {
      if(it.s === 'present'){ present++; if(it.auto) auto++; }
      else if(it.s === 'absent'){ absent++; if(it.auto) auto++; }
      else cancelled++;
    });
  });
  const total = present + absent;
  return {present, absent, cancelled, auto, total, pct: total ? Math.round(present / total * 100) : null};
}
function entityStats(term, info, ent){
  const acc = {present:0, absent:0, cancelled:0, auto:0, total:0};
  ent.sections.forEach(sec => {
    const s = sectionStats(term, info, sec);
    acc.present += s.present; acc.absent += s.absent; acc.cancelled += s.cancelled; acc.auto += s.auto; acc.total += s.total;
  });
  acc.pct = acc.total ? Math.round(acc.present / acc.total * 100) : null;
  return acc;
}

/* CT maths: only tests with published marks count towards scores and averages. */
function sectionMarks(section){
  const all = section.tests;
  const pub = all.filter(t => t.marks !== null);
  const sumMaxAll = all.reduce((a,t) => a + t.max, 0);
  const sumMaxPub = pub.reduce((a,t) => a + t.max, 0);
  const scored = pub.reduce((a,t) => a + t.marks, 0);
  return {
    sumMaxAll, sumMaxPub, scored,
    pending: all.length - pub.length,
    avgPct: sumMaxPub ? Math.round(scored / sumMaxPub * 100) : null
  };
}

function computeOverall(term, info){
  let present = 0, total = 0, scored = 0, maxPub = 0, pending = 0;
  term.entities.forEach(ent => ent.sections.forEach(sec => {
    const a = sectionStats(term, info, sec);
    present += a.present; total += a.total;
    const m = sectionMarks(sec);
    scored += m.scored; maxPub += m.sumMaxPub; pending += m.pending;
  }));
  return {
    attPct: total ? Math.round(present / total * 100) : null,
    avgPct: maxPub ? Math.round(scored / maxPub * 100) : null,
    pending
  };
}
function computeProgress(term, info){
  if(info.today < term.start) return `Starts ${fmtShort(term.start)}`;
  const done = info.classDates.filter(d => d <= info.today).length;
  return done >= term.totalClassDays ? `Done · ${term.totalClassDays}` : `${done} / ${term.totalClassDays}`;
}
function gradeColor(pct){
  if(pct >= 80) return 'var(--green)';
  if(pct >= 60) return 'var(--gold)';
  return 'var(--crimson)';
}
function routineSummary(section){
  if(!section.routine.length) return '';
  const counts = {};
  section.routine.forEach(r => { counts[r.dow] = (counts[r.dow] || 0) + 1; });
  return WORK_DAYS.filter(d => counts[d]).map(d => DOW_SHORT[d] + (counts[d] > 1 ? '×' + counts[d] : '')).join(' · ');
}

/* ---------------- modal system ---------------- */
let modal = null;
function openModal(spec){ modal = spec; drawModal(); }
function closeModal(){
  const m = modal; modal = null;
  $('modalRoot').innerHTML = '';
  if(m && m.onClose) m.onClose();
}
function drawModal(){
  const root = $('modalRoot');
  if(!modal){ root.innerHTML = ''; return; }
  const prev = root.querySelector('.modal-card');
  const scroll = prev ? prev.scrollTop : 0;
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal-card ${modal.cls || ''}" role="dialog" aria-modal="true">${modal.render()}</div></div>`;
  const card = root.querySelector('.modal-card');
  card.scrollTop = scroll;
  const overlay = $('modalOverlay');
  let downOnOverlay = false;
  overlay.addEventListener('mousedown', e => { downOnOverlay = e.target === overlay; });
  overlay.addEventListener('click', e => { if(downOnOverlay && e.target === overlay) closeModal(); });
  if(modal.wire) modal.wire(root);
}
function refreshModal(){ if(modal && modal.live) drawModal(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape' && modal) closeModal(); });

function askConfirm({title, message, confirmLabel = 'Confirm', danger = false}){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if(!done){ done = true; resolve(v); } };
    openModal({
      cls:'',
      render:() => `<h4>${escapeHtml(title)}</h4><div class="modal-sub">${escapeHtml(message)}</div>
        <div class="modal-actions">
          <button class="ghost" data-act="no">Cancel</button>
          <button class="primary ${danger ? 'danger' : ''}" data-act="yes">${escapeHtml(confirmLabel)}</button>
        </div>`,
      wire:root => {
        root.querySelector('[data-act="no"]').addEventListener('click', closeModal);
        root.querySelector('[data-act="yes"]').addEventListener('click', () => { finish(true); closeModal(); });
      },
      onClose:() => finish(false)
    });
  });
}

function fieldHtml(f){
  const id = 'f_' + f.id;
  if(f.type === 'note') return `<div class="modal-sub">${f.html}</div>`;
  if(f.type === 'checkbox') return `<label class="modal-check"><input type="checkbox" id="${id}" ${f.value ? 'checked' : ''}> ${escapeHtml(f.label)}</label>`;
  if(f.type === 'swatches'){
    return `<div class="modal-field"><label>${escapeHtml(f.label)}</label>
      <div class="swatches" id="${id}" data-value="${escapeHtml(f.value)}">${PALETTE.map(c =>
        `<button type="button" class="swatch ${c === f.value ? 'sel' : ''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>`;
  }
  if(f.type === 'select'){
    return `<div class="modal-field"><label for="${id}">${escapeHtml(f.label)}</label>
      <select id="${id}" ${f.disabled ? 'disabled' : ''}>${f.options.map(o =>
        `<option value="${escapeHtml(o.value)}" ${o.value === f.value ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}</select>
      ${f.hint ? `<div class="hint">${escapeHtml(f.hint)}</div>` : ''}</div>`;
  }
  return `<div class="modal-field"><label for="${id}">${escapeHtml(f.label)}</label>
    <input id="${id}" type="${f.type || 'text'}" value="${escapeHtml(f.value == null ? '' : f.value)}" placeholder="${escapeHtml(f.placeholder || '')}"
      ${f.step ? `step="${f.step}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} autocomplete="off">
    ${f.hint ? `<div class="hint">${escapeHtml(f.hint)}</div>` : ''}</div>`;
}

/* Generic form dialog. Resolves with {field: value} on submit, null when cancelled,
   or {__action:'x'} when one of the extra buttons is used. */
function askForm({title, sub, fields, submitLabel = 'Save', extraButtons = []}){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if(!done){ done = true; resolve(v); } };
    openModal({
      cls:'mid',
      render:() => `<h4>${escapeHtml(title)}</h4>${sub ? `<div class="modal-sub">${sub}</div>` : ''}
        <form id="modalForm" novalidate>
          ${fields.map(fieldHtml).join('')}
          <div class="modal-actions">
            <button type="button" class="ghost" data-act="cancel">Cancel</button>
            ${extraButtons.map(b => `<button type="button" class="ghost ${b.cls || ''}" data-extra="${b.act}">${escapeHtml(b.label)}</button>`).join('')}
            <button type="submit" class="primary">${escapeHtml(submitLabel)}</button>
          </div>
        </form>`,
      wire:root => {
        const form = root.querySelector('#modalForm');
        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
        root.querySelectorAll('[data-extra]').forEach(b => b.addEventListener('click', () => {
          finish({__action:b.dataset.extra}); closeModal();
        }));
        root.querySelectorAll('.swatches').forEach(sw => sw.addEventListener('click', e => {
          const b = e.target.closest('.swatch'); if(!b) return;
          sw.dataset.value = b.dataset.color;
          sw.querySelectorAll('.swatch').forEach(x => x.classList.toggle('sel', x === b));
        }));
        const first = form.querySelector('input[type=text], input[type=number], input[type=date]');
        if(first && !/Mobi|Android/i.test(navigator.userAgent)) first.focus();
        form.addEventListener('submit', e => {
          e.preventDefault();
          const out = {};
          for(const f of fields){
            if(f.type === 'note') continue;
            const el = form.querySelector('#f_' + f.id);
            if(f.type === 'checkbox') out[f.id] = el.checked;
            else if(f.type === 'swatches') out[f.id] = el.dataset.value;
            else out[f.id] = el.value.trim();
            if(f.required && !out[f.id]){
              el.style.outline = '1.5px solid var(--crimson)'; el.focus();
              showToast(`${f.label} is required`); return;
            }
          }
          for(const f of fields){
            if(f.validate){
              const msg = f.validate(out);
              if(msg){ showToast(msg); const el = form.querySelector('#f_' + f.id); if(el) el.focus(); return; }
            }
          }
          finish(out); closeModal();
        });
      },
      onClose:() => finish(null)
    });
  });
}

/* ---------------- per-term UI state ---------------- */
function tstate(term){ return ui.perTerm[term.id] || (ui.perTerm[term.id] = {entityId:null, sectionId:null, month:null}); }
function resolveActive(term, info){
  const st = tstate(term);
  const ent = term.entities.find(e => e.id === st.entityId) || term.entities[0] || null;
  st.entityId = ent ? ent.id : null;
  const sec = ent ? (ent.sections.find(s => s.id === st.sectionId) || ent.sections[0]) : null;
  st.sectionId = sec ? sec.id : null;
  if(!st.month){
    const t = info.today;
    const base = (t >= term.start && t <= info.endIso) ? t : term.start;
    st.month = base.slice(0, 7) + '-01';
  }
  return {st, ent, sec};
}

/* ---------------- main render ---------------- */
function render(){
  const term = curTerm();
  const info = computeTermInfo(term);
  renderCover(term, info);
  renderSettings(term, info);
  renderTabs(term, info);
  renderPage(term, info);
  refreshModal();
}

function renderCover(term, info){
  $('termName').value = term.name;
  $('termSelect').innerHTML = db.terms.map(t =>
    `<option value="${t.id}" ${t.id === term.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('');

  $('statCards').innerHTML = `
    <div class="stat-card"><div class="stat-num">${o.attPct === null ? '—' : o.attPct + '%'}</div><div class="stat-label">Attendance</div></div>
    <div class="stat-card"><div class="stat-num">${o.avgPct === null ? '—' : o.avgPct + '%'}</div><div class="stat-label">Avg. CT Marks</div></div>
    <div class="stat-card"><div class="stat-num">${o.pending}</div><div class="stat-label">Marks Pending</div></div>
    <div class="stat-card"><div class="stat-num">${computeProgress(term, info)}</div><div class="stat-label">Class Days</div></div>
    <div class="stat-card"><div class="stat-num">${term.entities.length}</div><div class="stat-label">Subjects</div></div>`;
}

function autosaveBlockHtml(){
  if(!FS_SUPPORTED){
    const why = IS_BRAVE
      ? `Brave turns this feature off by default. To enable it: open <b>brave://flags/#file-system-access-api</b>, set it to <b>Enabled</b>, restart Brave, and come back here.`
      : `This browser does not let websites write to a file on your computer (Chrome, Edge and Brave-with-the-flag-enabled on desktop do).`;
    return `<div class="note">${why}<br>Nothing is lost meanwhile: your data is already saved inside the app, and you can export a backup file whenever you like.</div>`;
  }
  const last = fsLastWrite ? ` Last written ${fmtStamp(fsLastWrite)}.` : '';
  if(fsState === 'active'){
    return `<div class="note"><b>Connected.</b> Every change is written into your chosen file automatically.${last}</div>
      <div class="btn-row" style="margin-top:8px"><button class="ghost small" data-act="fs-disconnect">Disconnect</button></div>`;
  }
  if(fsState === 'needs-permission'){
    return `<div class="note warn"><b>Paused.</b> After a browser restart, the browser needs one tap of permission to keep writing to your file. Tap anywhere, or the button below.</div>
      <div class="btn-row" style="margin-top:8px"><button class="ghost small" data-act="fs-resume">Allow now</button><button class="ghost small" data-act="fs-disconnect">Disconnect</button></div>`;
  }
  if(fsState === 'error'){
    return `<div class="note warn">The last write to your autosave file failed. Reconnect it to keep going.</div>
      <div class="btn-row" style="margin-top:8px"><button class="ghost small" data-act="fs-connect">Reconnect file</button><button class="ghost small" data-act="fs-disconnect">Disconnect</button></div>`;
  }

    <div class="btn-row" style="margin-top:8px"><button class="ghost small" data-act="fs-connect">🔗 Connect autosave file</button></div>`;
}
